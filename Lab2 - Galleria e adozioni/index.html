<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Adozione Gatti - Base</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 900px;
        margin: 20px auto;
        padding: 0 15px;
      }
      .controlli {
        margin-bottom: 20px;
        display: flex;
        gap: 10px;
      }
      button {
        padding: 8px 14px;
        cursor: pointer;
      }
      .griglia {
        display: flex;
        flex-wrap: wrap;
        gap: 15px;
        margin-bottom: 30px;
      }
      .card {
        border: 2px solid #ccc;
        border-radius: 10px;
        padding: 10px;
        width: 250px;
        text-align: center;
      }
      .card img {
        width: 100%;
        height: 180px;
        object-fit: cover;
        border-radius: 6px;
      }
      .card.adottato {
        border-color: #2e7d32;
        background-color: #e8f5e9;
      }
    </style>
  </head>
  <body>
    <h1>🐾 Centro Adozioni Gatti</h1>

    <div class="controlli">
      <button id="btn-carica">🔄 Carica Nuovi Gatti</button>
      <button id="btn-grandi">📏 Solo Foto Grandi (width > 600)</button>
      <button id="btn-tutti">👁️ Mostra Tutti</button>
    </div>

    <p id="messaggio-stato"></p>

    <h2>Gatti Disponibili</h2>
    <div id="galleria-api" class="griglia"></div>

    <hr />

    <h2>❤️ I Miei Gatti Adottati (<span id="contatore-adottati">0</span>)</h2>
    <div id="galleria-adottati" class="griglia"></div>

    <script src="app.js"></script>
  </body>
</html>
